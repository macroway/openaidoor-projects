version: "3.8"

services:
  backend:
    build: ./src/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src/backend:/app
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
