<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>模拟展商目录</title><style>body{font-family:system-ui;margin:40px;background:#f5f7fb;color:#172033}.notice{background:#fff3cd;padding:16px;border-radius:12px}.card{background:white;margin:12px 0;padding:16px;border-radius:12px}code{background:#eef;padding:2px 6px}</style></head><body><h1>未来智能产业展｜展商目录</h1><div class="notice">课堂离线模拟页面，不代表任何真实展会。完整数据位于同目录 <code>mock_exhibitors_api.json</code>。</div><div id="list"></div><script>fetch('./mock_exhibitors_api.json').then(r=>r.json()).then(d=>{document.querySelector('#list').innerHTML=d.exhibitors.slice(0,8).map(x=>'<div class="card"><b>'+x.company+'</b><br>'+x.industry+'｜'+x.hall+'<p>'+x.business+'</p></div>').join('')}).catch(()=>{document.querySelector('#list').innerHTML='<p>浏览器阻止本地 fetch 时，请直接读取 JSON 文件。</p>'})</script></body></html>
